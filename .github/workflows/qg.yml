name: Carnets QG

on:
  push:
    branches: [main]
  schedule:
    - cron: '0,15,45 8 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      subject:
        description: 'Sujet à publier tout de suite (laisser vide pour le tirage éditorial)'
        required: false
        type: string

concurrency:
  group: qg-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Préparer les fiches
        env:
          EVENT: ${{ github.event_name }}
          SUBJECT: ${{ inputs.subject }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [ "$EVENT" = push ]; then
            pnpm build
          else
            node scripts/qg.mjs --daily --subject "$SUBJECT"
            pnpm exec tailwindcss -i carnet.tailwind.css -o tailwind.css --minify
          fi
      - name: Enregistrer le catalogue et les fiches dans le dépôt
        if: github.event_name != 'push'
        run: |
          git add contenu fiches index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publier une fiche QG'
            git push origin HEAD:main
          fi
      - name: Préparer les fichiers publics
        run: |
          mkdir _site
          cp index.html style.css tailwind.css carnet.js instagram.js _site/
          cp -R fiches _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
